<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de cliques</title>
<style>
    .h1{
        color: blueviolet;
    }
</style>
</head>
<body>
    <div>
        <h1 class="h1">Blog</h1>

        <button id="botao">Gostei</button>

        <p id="texto"> </p>
        
    </div>

    <script>
        const botao = document.getElementById("botao");
        const nicole = document.getElementById("texto");
        let contador = 0;

        botao.addEventListener("click", () => {
            contador++;
            nicole.textContent = "cliques: " + contador;
            console.log(contador)

        })
    </script>
</body>
</html>
